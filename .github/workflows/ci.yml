name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts/smoke_installed_wheel.py
          ruff format --check src tests scripts/smoke_installed_wheel.py
      - name: Types (strict)
        run: python -m mypy
      - name: Tests (offline; includes secret scan + E2E/resume/stability demos)
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - name: CLI smoke from isolated built wheel
        run: python scripts/smoke_installed_wheel.py dist
