name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Types (strict)
        run: python -m mypy
      - name: Tests (offline; includes secret scan + E2E/resume/stability demos)
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - name: CLI smoke (synthetic end-to-end demo)
        run: |
          loop-engineering audit-github \
            --subjects examples/subjects.synthetic.yaml \
            --fixtures evals/fixtures/github
          loop-engineering verify "$(ls -d runs/github-authority-audit-synthetic/run-*)"
          test -f outputs/github-authority-audit-synthetic/accuracy-evidence.md
