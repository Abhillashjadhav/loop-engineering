name: LinkedIn broad pull (multi-actor)

# Manually triggered one-off — hits 4 Apify LinkedIn actors in parallel,
# dedupes, filters by Head-of-Product / Director / Principal PM / GPM /
# VP / Senior / Lead (drops Engineering titles per user 2026-06-16),
# commits results to data/jobs/ on main.

on:
  workflow_dispatch:
    inputs:
      actors:
        description: 'Comma-separated actor subset (e.g. bebity,harvestapi). Empty = all 4.'
        required: false
        default: ''
      past_days:
        description: 'How many days back to search (default 30).'
        required: false
        default: '30'

concurrency:
  group: linkedin-multi-actor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # valig+curious_coder ~90s/query × 24 queries ≈ 72 min
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose token presence (length only)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "APIFY_TOKEN length: ${#APIFY_TOKEN}"
          if [ "${#APIFY_TOKEN}" -eq 0 ]; then
            echo "::error::APIFY_TOKEN secret missing or empty"
            exit 1
          fi

      - name: Run multi-actor pull
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTORS: ${{ github.event.inputs.actors }}
          PAST_DAYS: ${{ github.event.inputs.past_days }}
        run: |
          python scripts/linkedin_multi_actor_pull.py

      - name: Commit results to main
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "dreamjob-agent[bot]"
          git add data/jobs/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "linkedin-multi-actor: pull for $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-multi-actor-${{ github.run_id }}
          path: data/jobs/
          retention-days: 14
