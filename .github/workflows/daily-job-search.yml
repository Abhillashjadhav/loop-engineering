name: Daily Job Search Pipeline

# run-name surfaces test mode in the Actions UI so a no-Apify run can never
# be mistaken for a real one at a glance.
run-name: >-
  Daily Job Search${{ github.event.inputs.test_mode_no_apify_zero_output_expected == 'true' && ' — ⚠️ TEST MODE (no-Apify, ZERO OUTPUT EXPECTED)' || '' }}${{ github.event.inputs.score_offset != '' && github.event.inputs.score_offset != '0' && format(' [batch offset={0}]', github.event.inputs.score_offset) || '' }}

on:
  schedule:
    # 03:00 UTC = 08:30 IST per CLAUDE.md mission line
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Run for specific date (YYYY-MM-DD). Defaults to today UTC.'
        required: false
        default: ''
      test_mode_no_apify_zero_output_expected:
        description: >-
          DANGER: test mode. Skips Apify. A run with this ON is EXPECTED to
          produce ZERO real output. Never use for a real daily run. Requires
          confirm_test_mode=true or the run is refused at preflight.
        type: boolean
        default: false
      confirm_test_mode:
        description: >-
          Must be set to true to acknowledge test mode. If test mode is on
          and this is false, the run fails at preflight with a clear error.
        type: boolean
        default: false
      apify_fallback_mode:
        description: >-
          strict = Apify required, fail if unavailable (default).
          gmail_only = skip Apify, score on title+company at reduced
          confidence + lower fit threshold.
          skip = skip Apify entirely (gated by the test-mode confirmation).
        type: choice
        options: [strict, gmail_only, skip]
        default: strict
      score_offset:
        description: >-
          Batch mode: skip first N filtered candidates before scoring.
          Use 0 for the first batch (default). Set 60 for batch 2, 120
          for batch 3, 180 for batch 4. When offset > 0 and a prior batch
          already ran on the same date, fetch is skipped automatically
          (reuses existing _filtered_candidates.jsonl).
        required: false
        default: '0'
      score_limit:
        description: >-
          Batch mode: score at most N candidates per run (0 = no limit).
          Set to 60-75 per batch so each run finishes well under 2 hours.
        required: false
        default: '0'
      source_date:
        description: >-
          Reuse filtered candidates from a prior date's daily-runs branch
          instead of calling Apify/Indeed/Gmail again. Set to YYYY-MM-DD
          (e.g. 2026-06-18) to restore _filtered_candidates_all.jsonl from
          that date and skip the fetch phase entirely — saves Apify credits
          when you already have a good pool from a previous run.
          Leave blank for a normal fresh fetch.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-run:
    runs-on: ubuntu-latest
    # Bumped to 200 min. Resume generation is now parallelised (4 workers,
    # agent/run_daily.py RESUME_MAX_WORKERS) so a normal 10-fit run takes
    # ~30 min for resumes. The 200-min cap is a generous backstop.
    timeout-minutes: 200
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Liberation Sans fonts (for embedded-font resumes)
        run: sudo apt-get install -y fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI (uses Max-plan OAuth, no API billing)
        # Installs the `claude` CLI globally. At runtime it picks up
        # CLAUDE_CODE_OAUTH_TOKEN from env and consumes against the user's
        # Claude Max subscription quota — $0 incremental cost on the $200 plan.
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version || echo "claude CLI installed; version check non-fatal"

      - name: Resolve run date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "RUN_DATE=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "RUN_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Preflight — test-mode confirmation gate
        # Test mode skips Apify and is EXPECTED to produce zero real output.
        # It must be explicitly confirmed; an unconfirmed test-mode run is a
        # configuration mistake and is failed loudly here, before any work.
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode_no_apify_zero_output_expected }}
          CONFIRM: ${{ github.event.inputs.confirm_test_mode }}
        run: |
          if [ "$TEST_MODE" = "true" ] && [ "$CONFIRM" != "true" ]; then
            echo "::error::Test mode (test_mode_no_apify_zero_output_expected) is ON"
            echo "::error::but confirm_test_mode is not true. Refusing to run."
            echo "::error::Test mode skips Apify and produces ZERO real output."
            echo "::error::If you genuinely want a test run, re-dispatch with"
            echo "::error::confirm_test_mode=true. Otherwise turn test mode OFF."
            exit 1
          fi
          if [ "$TEST_MODE" = "true" ]; then
            echo "::warning::TEST MODE confirmed — Apify skipped, zero output expected."
          else
            echo "Preflight OK — normal run (Apify enabled)."
          fi

      - name: Diagnose secrets (length only, never value)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo "APIFY_TOKEN length:             ${#APIFY_TOKEN}"
          echo "GMAIL_REFRESH_TOKEN length:     ${#GMAIL_REFRESH_TOKEN}"
          if [ "${#CLAUDE_CODE_OAUTH_TOKEN}" -eq 0 ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is missing or empty — Opus path disabled"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN starts with: ${CLAUDE_CODE_OAUTH_TOKEN:0:13}..."
          fi

      # Restore prior batch artifacts. Runs in two cases:
      #   (a) Batch 2-4: score_offset > 0 — restore _filtered_candidates_all.jsonl
      #       from the current date's daily-runs branch (written by batch 1).
      #   (b) source_date set: restore _filtered_candidates_all.jsonl from a prior
      #       date's branch so Apify/Indeed/Gmail is never called again — saves
      #       credits when we already have a good pool (e.g. yesterday's 290 jobs).
      # In both cases the file is stubbed to _filtered_candidates.jsonl so that
      # skip_fetch's existence check (filtered_path.exists()) fires correctly.
      - name: Restore prior batch artifacts
        if: (github.event.inputs.score_offset != '' && github.event.inputs.score_offset != '0') || github.event.inputs.source_date != ''
        run: |
          SOURCE_DATE="${{ github.event.inputs.source_date }}"
          OFFSET="${{ github.event.inputs.score_offset }}"
          OFFSET="${OFFSET:-0}"
          if [ -n "$SOURCE_DATE" ]; then
            # source_date set: pull from that date's branch (any batch, incl. offset=0)
            BRANCH="claude/daily-runs/$SOURCE_DATE"
            echo "Restoring filtered candidates from $BRANCH"
            git fetch origin "$BRANCH" 2>/dev/null || { echo "Branch $BRANCH not found — will do full fetch"; exit 0; }
            git checkout "origin/$BRANCH" -- \
              "outputs/$SOURCE_DATE/_filtered_candidates_all.jsonl" \
              2>/dev/null || \
            git checkout "origin/$BRANCH" -- \
              "outputs/$SOURCE_DATE/_filtered_candidates.jsonl" \
              2>/dev/null || { echo "No filtered file in $BRANCH — will do full fetch"; exit 0; }
            # Copy to today's output dir under the expected names.
            mkdir -p "outputs/${{ steps.date.outputs.RUN_DATE }}"
            if [ -f "outputs/$SOURCE_DATE/_filtered_candidates_all.jsonl" ]; then
              cp "outputs/$SOURCE_DATE/_filtered_candidates_all.jsonl" \
                 "outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates_all.jsonl"
            elif [ -f "outputs/$SOURCE_DATE/_filtered_candidates.jsonl" ]; then
              cp "outputs/$SOURCE_DATE/_filtered_candidates.jsonl" \
                 "outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates_all.jsonl"
            fi
            cp "outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates_all.jsonl" \
               "outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates.jsonl"
            echo "Restored $(wc -l < outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates.jsonl) candidates from $SOURCE_DATE"
          else
            # Batch 2-4: restore from current date's branch (written by batch 1).
            BRANCH="claude/daily-runs/${{ steps.date.outputs.RUN_DATE }}"
            git fetch origin "$BRANCH" 2>/dev/null || { echo "No prior branch — will do full fetch"; exit 0; }
            git checkout "origin/$BRANCH" -- \
              "outputs/${{ steps.date.outputs.RUN_DATE }}/_raw_candidates.jsonl" \
              "outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates_all.jsonl" \
              2>/dev/null || echo "Prior batch files not found — will do full fetch"
            SRC="outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates_all.jsonl"
            DST="outputs/${{ steps.date.outputs.RUN_DATE }}/_filtered_candidates.jsonl"
            if [ -f "$SRC" ] && [ ! -f "$DST" ]; then
              cp "$SRC" "$DST"
            fi
          fi

      - name: Run daily pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Preferred scoring path — uses Claude Max plan OAuth quota, $0 incremental.
          # See docs/SETUP_GITHUB_ACTIONS.md Step 5.6 for one-time generation.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Legacy paid fallback — only used if CLAUDE_CODE_OAUTH_TOKEN is absent.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          # Apify is skipped when test mode is on OR fallback mode is
          # gmail_only / skip. TEST_MODE_NO_APIFY (the COMMIT 3 refusal gate)
          # additionally fires for test mode and for fallback mode 'skip'.
          # APIFY_FALLBACK_MODE drives the COMMIT 4 strict/gmail_only logic.
          SKIP_APIFY: ${{ github.event.inputs.test_mode_no_apify_zero_output_expected == 'true' || github.event.inputs.apify_fallback_mode == 'gmail_only' || github.event.inputs.apify_fallback_mode == 'skip' }}
          TEST_MODE_NO_APIFY: ${{ github.event.inputs.test_mode_no_apify_zero_output_expected == 'true' || github.event.inputs.apify_fallback_mode == 'skip' }}
          APIFY_FALLBACK_MODE: ${{ github.event.inputs.apify_fallback_mode }}
          # Resume generation parallelism — 4 workers by default.
          RESUME_MAX_WORKERS: '4'
          # When source_date is set, skip the fetch phase entirely and reuse
          # the restored filtered candidates from that prior date's run.
          SKIP_FETCH_FORCE: ${{ github.event.inputs.source_date != '' && 'true' || 'false' }}
        run: |
          OFFSET="${{ github.event.inputs.score_offset }}"
          LIMIT="${{ github.event.inputs.score_limit }}"
          OFFSET="${OFFSET:-0}"
          LIMIT="${LIMIT:-0}"
          SKIP_FETCH_ARG=""
          if [ -n "${{ github.event.inputs.source_date }}" ]; then
            SKIP_FETCH_ARG="--skip-fetch"
          fi
          python agent/run_daily.py \
            --date ${{ steps.date.outputs.RUN_DATE }} \
            --score-offset "$OFFSET" \
            --score-limit "$LIMIT" \
            $SKIP_FETCH_ARG

      - name: Commit and push run artifacts to daily-runs branch
        run: |
          git config user.name 'dreamjob-agent[bot]'
          git config user.email '[email protected]'
          BRANCH="claude/daily-runs/${{ steps.date.outputs.RUN_DATE }}"
          git checkout -B "$BRANCH"
          git add outputs/${{ steps.date.outputs.RUN_DATE }}/ outputs/seen_index.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            OFFSET="${{ github.event.inputs.score_offset }}"
            OFFSET="${OFFSET:-0}"
            if [ "$OFFSET" != "0" ]; then
              git commit -m "daily-run: ${{ steps.date.outputs.RUN_DATE }} [batch offset=$OFFSET]"
            else
              git commit -m "daily-run: ${{ steps.date.outputs.RUN_DATE }}"
            fi
            for delay in 2 4 8 16; do
              if git push -f -u origin "$BRANCH" 2>&1; then
                echo "Push OK"; break
              fi
              echo "Retry in ${delay}s..."
              sleep $delay
            done
          fi

      # Persist seen_index.jsonl back to main so tomorrow's run starts with full
      # cross-day history. The daily-runs/<date> branch is ephemeral — without
      # this step, dedupe degrades to a single-day window and the same roles
      # resurface every morning (confirmed bug 2026-05-26: 56% of fits were
      # repeats from the prior 8 days).
      - name: Persist seen_index.jsonl to main
        run: |
          git config user.name 'dreamjob-agent[bot]'
          git config user.email '[email protected]'
          BRANCH="claude/daily-runs/${{ steps.date.outputs.RUN_DATE }}"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git checkout "$BRANCH" -- outputs/seen_index.jsonl
          if git diff --cached --quiet; then
            echo "seen_index unchanged on main"
          else
            git commit -m "seen_index: append ${{ steps.date.outputs.RUN_DATE }} [skip ci]"
            for delay in 2 4 8 16; do
              if git push origin main 2>&1; then
                echo "seen_index pushed to main"; break
              fi
              echo "Retry in ${delay}s..."
              sleep $delay
            done
          fi

      - name: Upload artifacts (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-${{ steps.date.outputs.RUN_DATE }}${{ github.event.inputs.score_offset != '' && github.event.inputs.score_offset != '0' && format('-batch{0}', github.event.inputs.score_offset) || '' }}
          path: |
            outputs/${{ steps.date.outputs.RUN_DATE }}/
            outputs/trajectory.jsonl
          if-no-files-found: warn
          retention-days: 30
