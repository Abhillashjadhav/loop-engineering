# Draft goal contract for the LIVE GitHub authority audit of the two named
# subjects. Lock with `loop-engineering init examples/goal.yaml`. The live run
# requires an environment permitted to fetch public GitHub data (or snapshots
# pre-fetched into a fixture directory); it fails loudly otherwise.
goal_id: github-authority-audit-live
version: 1
goal_statement: >
  Using publicly available evidence only, determine whether the public GitHub
  portfolios of Aakash Gupta and Shubham Saboo demonstrate substantive GenAI
  technical proficiency, meaningful human/product/engineering reasoning,
  education/curation strength, distribution strength, heavily AI-assisted but
  useful creation, or shallow/templated work — without inferring private
  intent or exact authorship.
expected_output:
  deliverables:
    - cross-subject comparison
    - final answer with per-subject verdicts
    - person-level assessments
    - repository scorecards
  format_notes: markdown final answer plus JSON artifacts and scorecards
north_star_metric:
  name: human_active_minutes_saved_per_successfully_verified_goal
  baseline_manual_minutes: 720
leading_metrics:
  - percentage of planned tasks completed autonomously
  - first-pass task verification rate
  - percentage of material claims independently verified
  - average repair attempts per task
  - repeated-action rate
  - human interventions
  - six-run conclusion consistency
  - end-to-end goal-match score
scope:
  - verify subject identity from at least two public attributes
  - inventory all public repositories for each subject
  - assess repository quality across the ten-dimension rubric
  - aggregate person-level distributions and verdicts
  - compare subjects and answer the underlying question
  - produce final output with uncertainties disclosed
exclusions:
  - private intent, private contributions, or exact human/AI authorship
  - non-public data sources of any kind
  - judgments about the person rather than the public artifacts
allowed_actions:
  - read public GitHub profile and repository data (or pre-fetched snapshots)
  - write artifacts and evidence under the run directory
  - compute scores and classifications deterministically
forbidden_actions:
  - fetching non-public data
  - stating exact AI-authorship percentages
  - destructive operations of any kind
data_sources:
  - public GitHub profiles and repositories of the verified subject accounts
evidence_requirements:
  normal_claim_min_sources: 2
  high_impact_claim_min_sources: 3
success_checks:
  - every material claim carries at least two independent evidence origins
  - negative classifications carry counter-evidence and meet confidence floors
  - six analysis variants are compared and disagreements preserved
goal_match_threshold: 70
replication_count: 6
budget:
  max_iterations: 120
  max_task_attempts: 3
stop_conditions:
  - budget exhausted
  - circuit breaker tripped
  - human decision required
escalation_conditions:
  - identity cannot be confidently resolved
  - required source inaccessible
approved_at: "2026-07-16T00:00:00+00:00"
approved_by: abhillash
