[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering"
version = "1.0.0"
description = "Self-verifying autonomous goal loop: locked goal contract, atomic tasks, four verification loops, crash-safe resume, accuracy evidence packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhillash Jadhav" }]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "types-jsonschema",
    "build",
]

[project.scripts]
loop-engineering = "loop_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loop_engineering = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require live network/GitHub access (never required for CI)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["loop_engineering"]
warn_unreachable = true
